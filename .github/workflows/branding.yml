name: Images de la chaîne (CC0)

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Recherches séparées par ; (vide = défaut)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests Pillow
      - name: Chercher des photos CC0
        run: |
          IFS=';' read -ra Q <<< "${{ inputs.queries }}"
          python scripts/branding_candidates.py "${Q[@]}"
      - name: Enregistrer
        run: |
          git config user.name "yt-relax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branding
          git diff --cached --quiet || git commit -m "Images candidates pour la chaîne"
          git push
