name: Publier une vidéo pluie

on:
  schedule:
    - cron: "17 18 * * 1,3,5"   # lundi, mercredi, vendredi à 18:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (génère sans publier)"
        type: boolean
        default: true
      hours:
        description: "Durée en heures (vide = config.yaml ; test = 0.05)"
        type: string
        default: ""
      privacy:
        description: "Forcer la confidentialité (vide = config.yaml) : private | unlisted | public"
        type: string
        default: ""
      task:
        description: "Tâche"
        type: choice
        options: [video, branding]
        default: video
      queries:
        description: "branding : recherches séparées par ;"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  branding:
    if: inputs.task == 'branding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests Pillow
      - name: Chercher des photos CC0
        run: |
          IFS=';' read -ra Q <<< "${{ inputs.queries }}"
          python scripts/branding_candidates.py "${Q[@]}"
      - name: Enregistrer
        run: |
          git config user.name "yt-relax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branding
          git diff --cached --quiet || git commit -m "Images candidates pour la chaîne"
          git push

  publish:
    if: inputs.task != 'branding'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      PRIVACY_OVERRIDE: ${{ inputs.privacy }}
    steps:
      - name: Choisir le mode
        id: mode
        run: |
          if [ -z "$PIXABAY_API_KEY" ] || [ -z "$FREESOUND_API_KEY" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets PIXABAY_API_KEY / FREESOUND_API_KEY manquants."
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
            echo "hours=${{ inputs.hours || '0.05' }}" >> "$GITHUB_OUTPUT"
          elif [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "hours=${{ inputs.hours }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::Identifiants YouTube pas encore configurés : publication ignorée."
          fi

      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode != 'skip'

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils
        if: steps.mode.outputs.mode != 'skip'
        timeout-minutes: 15
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for i in 1 2 3; do
              timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq &&
              timeout 300 sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core && break
              echo "Nouvel essai d'installation ($i)…"; sleep 10
            done
          fi
          ffmpeg -version | head -1
          pip install -q -r requirements.txt

      - name: Préparer l'espace disque
        if: steps.mode.outputs.mode != 'skip'
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          ln -s /mnt/work out
          df -h / /mnt

      - name: Générer (et publier)
        if: steps.mode.outputs.mode != 'skip'
        run: |
          ARGS="--out out"
          [ -n "${{ steps.mode.outputs.hours }}" ] && ARGS="$ARGS --hours ${{ steps.mode.outputs.hours }}"
          [ "${{ steps.mode.outputs.mode }}" = "test" ] && ARGS="$ARGS --dry-run"
          python -m src.main $ARGS

      - name: Extrait léger (2 min autour du raccord de boucle)
        if: steps.mode.outputs.mode == 'test'
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/video.mp4)
          SEG=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/segment.mp4)
          START=$(python3 -c "d=$DUR; s=$SEG; print(max(0, min(s - 60, d - 120)))")
          ffmpeg -v error -y -ss "$START" -i out/video.mp4 -t 120 -c:v libx264 -preset veryfast -crf 28 -vf scale=1280:-2 -c:a aac -b:a 128k out/extrait.mp4
          ls -lh out/extrait.mp4

      - name: Aperçu du test
        if: steps.mode.outputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: apercu
          path: |
            out/extrait.mp4
            out/thumb.jpg
            out/frame.png
            out/metadata.json
          retention-days: 3

      - name: Enregistrer l'historique
        if: steps.mode.outputs.mode == 'publish'
        run: |
          git config user.name "yt-relax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Historique : nouvelle vidéo publiée"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && break
            sleep 5
          done
