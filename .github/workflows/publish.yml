name: Calm Haven Sounds
run-name: >-
  ${{ github.event_name == 'schedule' && github.event.schedule == '41 16 * * 0,2,4' && 'Short planifié'
  || github.event_name == 'schedule' && 'Vidéo planifiée (ambiance choisie par équilibrage)'
  || (inputs.task != 'video' && format('Tâche {0}', inputs.task))
  || format('Vidéo {0}{1}{2}{3}', inputs.theme || 'auto', inputs.beat && format(' {0} Hz', inputs.beat) || '',
            inputs.black && ' écran noir' || '', inputs.dry_run && ' (test)' || '') }}

on:
  schedule:
    - cron: "17 18 * * 1,3,5"   # lundi, mercredi, vendredi à 18:17 UTC : vidéo 8 h
    - cron: "41 16 * * 0,2,4"   # dimanche, mardi, jeudi à 16:41 UTC : Short qui renvoie vers une vidéo 8 h
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (génère sans publier)"
        type: boolean
        default: true
      hours:
        description: "Durée en heures (vide = config.yaml ; test = 0.05)"
        type: string
        default: ""
      privacy:
        description: "Forcer la confidentialité (vide = config.yaml) : private | unlisted | public"
        type: string
        default: ""
      theme:
        description: "Forcer une ambiance (vide = rotation) : window, forest, lake, roof, fireplace, ocean, waterfall, binaural, frequency"
        type: string
        default: ""
      thunder:
        description: "Avec une ambiance forcée : ajouter du tonnerre lointain"
        type: boolean
        default: false
      black:
        description: "Version écran noir (son seul)"
        type: boolean
        default: false
      beat:
        description: "binaural : battement en Hz (10, 6, 2.5) — frequency : fréquence de la musique (432, 528, 396)"
        type: string
        default: ""
      force:
        description: "Ignorer exceptionnellement le plafond de 3 publications/jour"
        type: boolean
        default: false
      task:
        description: "Tâche"
        type: choice
        options: [video, short, branding, status, playlist_add, playlist_create, extra_backfill, noads, links, arabic, fixlang]
        default: video
      queries:
        description: "branding : recherches séparées par ; — playlist_add : « VIDEO_ID PLAYLIST_ID »"
        type: string
        default: ""

permissions:
  contents: write
  issues: write   # en cas d'échec : une « issue » au titre précis (mail de notification explicite)

jobs:
  branding:
    if: inputs.task == 'branding'
    name: Images de branding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests Pillow
      - name: Chercher des photos CC0
        run: |
          IFS=';' read -ra Q <<< "${{ inputs.queries }}"
          python scripts/branding_candidates.py "${Q[@]}"
      - name: Enregistrer
        run: |
          git config user.name "yt-relax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branding
          git diff --cached --quiet || git commit -m "Images candidates pour la chaîne"
          git push

  status:
    name: Tâche ${{ inputs.task }}
    if: inputs.task == 'status' || inputs.task == 'playlist_add' || inputs.task == 'noads' || inputs.task == 'links' || inputs.task == 'arabic' || inputs.task == 'fixlang' || inputs.task == 'playlist_create' || inputs.task == 'extra_backfill'
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - name: Langue audio « Non applicable »
        if: inputs.task == 'fixlang'
        run: python scripts/fix_audio_lang.py
      - name: Ajouter la traduction arabe aux vidéos existantes
        if: inputs.task == 'arabic'
        run: |
          pip install -q PyYAML
          python scripts/add_arabic.py
          python scripts/arabic_preview.py
      - name: Ajouter les liens chaîne/playlist aux descriptions existantes
        if: inputs.task == 'links'
        run: |
          pip install -q PyYAML
          python scripts/add_links.py
      - name: Ajouter « No mid-roll ads » aux descriptions existantes
        if: inputs.task == 'noads'
        run: python scripts/add_noads_line.py
      - name: Remplir les playlists supplémentaires
        if: inputs.task == 'extra_backfill'
        run: |
          pip install -q PyYAML
          python scripts/backfill_extra_playlists.py
      - name: Créer une playlist
        if: inputs.task == 'playlist_create'
        env:
          PL: ${{ inputs.queries }}
        run: python scripts/playlist_create.py "$PL"
      - name: Ajouter une vidéo à une playlist
        if: inputs.task == 'playlist_add'
        run: python scripts/playlist_add.py ${{ inputs.queries }}
      - name: État de la chaîne (lecture seule)
        run: python scripts/channel_status.py

      - name: Signaler l'échec (titre précis)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "❌ Échec de la tâche « ${{ inputs.task }} » ($(date -u +'%d/%m %H:%M') UTC)" \
            --body "Journal : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish:
    name: Vidéo ${{ inputs.theme || 'auto' }}
    if: (inputs.task == 'video' || inputs.task == '') && github.event.schedule != '41 16 * * 0,2,4'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    concurrency:
      group: publish-${{ inputs.theme || 'rotation' }}${{ inputs.black && '-black' || '' }}
      cancel-in-progress: false
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      PRIVACY_OVERRIDE: ${{ inputs.privacy }}
    steps:
      - name: Choisir le mode
        id: mode
        run: |
          if [ -z "$PIXABAY_API_KEY" ] || [ -z "$FREESOUND_API_KEY" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets PIXABAY_API_KEY / FREESOUND_API_KEY manquants."
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
            echo "hours=${{ inputs.hours || '0.05' }}" >> "$GITHUB_OUTPUT"
          elif [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "hours=${{ inputs.hours }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::Identifiants YouTube pas encore configurés : publication ignorée."
          fi

      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode != 'skip'

      - name: Historique à jour (rotation des ambiances)
        if: steps.mode.outputs.mode != 'skip'
        run: git fetch -q origin main && git checkout -q FETCH_HEAD -- history.json || echo "::warning::Historique non actualisé"

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils
        if: steps.mode.outputs.mode != 'skip'
        timeout-minutes: 25
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Les dépôts tiers du runner (Microsoft, etc.) ralentissent ou bloquent apt : on ne garde que ceux d'Ubuntu.
            sudo mkdir -p /etc/apt/disabled-sources
            for f in /etc/apt/sources.list.d/*; do
              [ -e "$f" ] || continue
              case "$(basename "$f")" in ubuntu.sources|ubuntu.list) ;; *) sudo mv "$f" /etc/apt/disabled-sources/ ;; esac
            done
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            for i in 1 2 3; do
              timeout 300 sudo apt-get $APT update -q && \
              timeout 300 sudo apt-get $APT install -y -q --no-install-recommends ffmpeg fonts-dejavu-core && break
              echo "Nouvel essai d'installation ($i)…"; sleep 15
            done
          fi
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || { echo "::error::ffmpeg introuvable"; exit 1; }
          ffmpeg -version | head -1
          pip install -q -r requirements.txt

      - name: Préparer l'espace disque
        if: steps.mode.outputs.mode != 'skip'
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          ln -s /mnt/work out
          df -h / /mnt

      - name: Générer (et publier)
        if: steps.mode.outputs.mode != 'skip'
        run: |
          ARGS="--out out"
          [ -n "${{ steps.mode.outputs.hours }}" ] && ARGS="$ARGS --hours ${{ steps.mode.outputs.hours }}"
          [ "${{ steps.mode.outputs.mode }}" = "test" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ inputs.theme }}" ] && ARGS="$ARGS --theme ${{ inputs.theme }}"
          [ "${{ inputs.thunder }}" = "true" ] && ARGS="$ARGS --thunder"
          [ "${{ inputs.black }}" = "true" ] && ARGS="$ARGS --black"
          if [ -n "${{ inputs.beat }}" ]; then
            if [ "${{ inputs.theme }}" = "frequency" ]; then ARGS="$ARGS --hz ${{ inputs.beat }}"; else ARGS="$ARGS --beat ${{ inputs.beat }}"; fi
          fi
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python -m src.main $ARGS

      - name: Extrait léger (2 min autour du raccord de boucle)
        if: steps.mode.outputs.mode == 'test'
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/video.mp4)
          SEG=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/segment.mp4)
          START=$(python3 -c "d=$DUR; s=$SEG; print(max(0, min(s - 60, d - 120)))")
          ffmpeg -v error -y -ss "$START" -i out/video.mp4 -t 120 -c:v libx264 -preset veryfast -crf 28 -vf scale=1280:-2 -c:a aac -b:a 128k out/extrait.mp4
          ls -lh out/extrait.mp4

      - name: Aperçu du test
        if: steps.mode.outputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: apercu
          path: |
            out/extrait.mp4
            out/thumb.jpg
            out/frame.png
            out/metadata.json
          retention-days: 3

      - name: Enregistrer l'historique
        if: steps.mode.outputs.mode == 'publish'
        run: |
          git config user.name "yt-relax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp out/history_entry.json "$RUNNER_TEMP/entry.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/add_history.py "$RUNNER_TEMP/entry.json"
            git add history.json
            if git diff --cached --quiet; then break; fi
            git commit -qm "Historique : nouvelle vidéo publiée" && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done

      - name: Signaler l'échec (titre précis)
        if: failure() && steps.mode.outputs.mode != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHOIX=$(cat out/choice.txt 2>/dev/null || echo "${{ inputs.theme || 'ambiance auto' }}")
          ETAPE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name][0] // "inconnue"' 2>/dev/null || echo "inconnue")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "❌ Vidéo non publiée : $CHOIX — étape « $ETAPE » ($(date -u +'%d/%m %H:%M') UTC)" \
            --body "Journal : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  short:
    name: Short
    if: inputs.task == 'short' || github.event.schedule == '41 16 * * 0,2,4'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Historique à jour
        run: git fetch -q origin main && git checkout -q FETCH_HEAD -- history.json && (git checkout -q FETCH_HEAD -- shorts.json 2>/dev/null || true)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les outils
        timeout-minutes: 25
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo mkdir -p /etc/apt/disabled-sources
            for f in /etc/apt/sources.list.d/*; do
              [ -e "$f" ] || continue
              case "$(basename "$f")" in ubuntu.sources|ubuntu.list) ;; *) sudo mv "$f" /etc/apt/disabled-sources/ ;; esac
            done
            for i in 1 2 3; do
              timeout 300 sudo apt-get -o Acquire::Retries=3 update -q && \
              timeout 300 sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core && break
              sleep 15
            done
          fi
          command -v ffmpeg >/dev/null || { echo "::error::ffmpeg introuvable"; exit 1; }
          pip install -q -r requirements.txt
      - name: Générer (et publier) le Short
        run: |
          ARGS="--out out"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ inputs.queries }}" ] && ARGS="$ARGS --video ${{ inputs.queries }}"
          python -m src.short $ARGS
      - name: Aperçu du test
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: apercu-short
          path: |
            out/short.mp4
            out/short_metadata.json
          retention-days: 3
      - name: Enregistrer le Short
        if: hashFiles('out/short_entry.json') != ''
        run: |
          git config user.name "yt-relax-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp out/short_entry.json "$RUNNER_TEMP/entry.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/add_history.py "$RUNNER_TEMP/entry.json" shorts.json
            git add shorts.json
            if git diff --cached --quiet; then break; fi
            git commit -qm "Shorts : nouveau Short publié" && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
      - name: Signaler l'échec (titre précis)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "❌ Short non publié ($(date -u +'%d/%m %H:%M') UTC)" \
            --body "Journal : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
