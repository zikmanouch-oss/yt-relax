# Réglages de la chaîne — modifiables sans toucher au code.

hours: 8                 # durée de chaque vidéo (heures)
max_per_day: 3           # plafond déclaré à Google (jour = minuit heure du Pacifique)
segment_minutes: 15      # longueur de la séquence vidéo avant qu'elle se répète
clips_per_video: 8       # nombre de clips vidéo mélangés
sounds_per_video: 5      # nombre d'enregistrements mélangés
video_maxrate: 3M        # débit vidéo max (8 h ≈ 11 Go)

privacy: public          # public | unlisted | private
category_id: 22          # 22 = People & Blogs, 10 = Music
playlist_id: "PLbbqInyCAtYM" # playlist pluie (ambiances sans « playlist » propre)

# Playlists où chaque nouvelle vidéo est AUSSI ajoutée (ex. sons anti-anxiété)
extra_playlists: ["PLEChJox9ZBJU"]   # « Calming Sounds for Anxiety & Stress Relief »

# Clips à ne plus jamais utiliser (ID Pixabay, visibles dans metadata.json)
blocked_clips: []

# Équilibrage automatique (06/11) : chaque publication prend la famille (pluie / feu / océan)
# qui a le MOINS de vidéos sur la chaîne (écrans noirs compris) ; pas de pluie tant que
# feu et océan n'ont pas rattrapé. Dans une famille, ses variantes ci-dessous tournent.
# Poids par famille. Depuis le 14/11 le poids est AUTOMATIQUE (vues réelles, stats/daily.json) :
# de 1 (famille la moins regardée) à 3 (la plus regardée). Les valeurs ci-dessous sont des planchers.
family_weight: { binaural: 2 }

variants:
  - { theme: ocean,     thunder: false }
  - { theme: fireplace, thunder: false }
  - { theme: roof,      thunder: true }
  - { theme: ocean,     thunder: false }
  - { theme: fireplace, thunder: false }
  - { theme: window,    thunder: false }
  - { theme: ocean,     thunder: false }
  - { theme: fireplace, thunder: false }
  - { theme: forest,    thunder: true }
  - { theme: waterfall, thunder: false }
  - { theme: frequency, thunder: false, hz: 432 }    # musique de fréquences (08/11) : 432 Hz
  - { theme: frequency, thunder: false, hz: 528, bed: rain }                 # idées Studio (09/11)
  - { theme: frequency, thunder: false, hz: 432, theta: true }
  - { theme: frequency, thunder: false, hz: 432, bed: ocean, black: true }   # un seul écran noir « frequency »
  - { theme: frequency, thunder: false, hz: 396 }
  - { theme: frequency, thunder: false, hz: 528 }
  # bruits colorés (14/11) : d'abord l'écran noir de chaque couleur (un seul par ambiance), puis avec images
  - { theme: brown_noise, thunder: false, black: true }
  - { theme: green_noise, thunder: false, black: true }
  - { theme: pink_noise,  thunder: false, black: true }
  - { theme: white_noise, thunder: false, black: true }
  - { theme: brown_noise, thunder: false }
  - { theme: green_noise, thunder: false }
  - { theme: pink_noise,  thunder: false }
  - { theme: white_noise, thunder: false }

themes:
  window:
    video: ["raindrops window", "rain drops glass", "rain window"]
    sound: ["rain window", "rain on glass"]
  forest:
    video: ["rain forest", "rain leaves", "rainy jungle"]
    sound: ["rain forest", "rain leaves"]
  lake:
    video: ["rain on water", "rain lake", "rain pond drops"]
    sound: ["rain on water", "rain lake"]
  roof:
    video: ["rain roof", "rain cabin", "rain puddle"]
    sound: ["rain on roof", "rain tin roof"]
  fireplace:              # ambiance feu (hors rotation pluie, sans tonnerre)
    video: ["fireplace", "fireplace fire", "burning logs fireplace"]
    sound: ["fireplace crackling", "fire crackling", "crackling fire"]
    fallback_sound: "fireplace"
    playlist: "PLJQ4dxP4hw9M"  # playlist « Fireplace Sounds for Sleeping »
  ocean:                  # vagues de l'océan (hors pluie, sans tonnerre)
    video: ["ocean waves", "sea waves", "waves beach", "ocean waves rocks"]
    sound: ["ocean waves", "sea waves", "waves beach", "ocean surf"]
    fallback_sound: "ocean"
    playlist: "PLXQ6VvjRgovw"  # playlist « Ocean Waves Sounds for Sleeping »
  waterfall:              # chute d'eau (ajoutée le 06/11)
    video: ["waterfall", "waterfall forest", "waterfall nature", "cascade"]
    sound: ["waterfall", "waterfall close", "waterfall stream"]
    fallback_sound: "waterfall"
    playlist: "PLATawPPrs5qU"  # playlist « Waterfall Sounds for Sleeping »
  binaural:               # fréquences « binaural beats » (ajoutées le 06/11) : casque obligatoire
    video: ["calm lake sunset", "clouds sky sunset", "starry night sky", "mountain lake reflection", "calm sea sunset"]
    sound: ["gentle ocean waves", "calm sea waves", "soft rain", "gentle stream"]   # fond nature réel, discret
    fallback_sound: "ocean waves"
    carrier_hz: 200
    bed_gain: 0.55
    playlist: "PLCiVOej35SE4"  # playlist « Binaural Beats for Anxiety & Stress Relief – Calming Frequencies »
  frequency:              # musique de fréquences synthétisée (validée par le propriétaire le 08/11)
    mode: tonal            # aucun son de nature : musique calculée par src/tonal.py
    video: ["starry night sky", "night sky timelapse", "aurora borealis", "clouds timelapse sunset", "milky way"]
    binaural_beat: 6       # léger battement binaural sous la musique (Hz)
    playlist: "PLCiVOej35SE4"  # même playlist que binaural (fréquences / anxiété)
    beds:                  # déclinaisons « musique + fond nature discret » (09/11)
      rain:
        video: ["rain window night", "raindrops window", "rain night", "rain drops glass"]
        sound: ["rain window", "gentle rain", "rain on glass"]
        fallback_sound: "rain"
        level: 0.35
      ocean:
        video: ["ocean waves night", "sea waves moonlight", "ocean waves", "calm sea sunset"]
        sound: ["ocean waves", "gentle sea waves", "calm sea waves"]
        fallback_sound: "ocean"
        level: 0.35
  # Bruits colorés synthétisés (src/noise.py) : aucune dépendance à Freesound.
  brown_noise:
    mode: noise
    color: brown
    video: ["starry night sky", "night sky stars", "milky way", "dark clouds night"]
    playlist: "PLaQ99eJLzp64"   # « Brown Noise, Pink Noise & White Noise for Sleep and Focus »
  pink_noise:
    mode: noise
    color: pink
    video: ["clouds sky sunset", "calm sea sunset", "fog forest", "clouds timelapse"]
    playlist: "PLaQ99eJLzp64"   # « Brown Noise, Pink Noise & White Noise for Sleep and Focus »
  green_noise:
    mode: noise
    color: green
    video: ["forest trees wind", "green forest", "forest fog", "mountain forest"]
    playlist: "PLaQ99eJLzp64"   # « Brown Noise, Pink Noise & White Noise for Sleep and Focus »
  white_noise:
    mode: noise
    color: white
    video: ["snow falling", "clouds sky", "fog mountain", "calm lake fog"]
    playlist: "PLaQ99eJLzp64"   # « Brown Noise, Pink Noise & White Noise for Sleep and Focus »
  thunder_sound: ["distant thunder", "thunder rumble"]
