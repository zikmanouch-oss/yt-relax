# Réglages de la chaîne — modifiables sans toucher au code.

hours: 8                 # durée de chaque vidéo (heures)
max_per_day: 3           # plafond déclaré à Google (jour = minuit heure du Pacifique)
segment_minutes: 15      # longueur de la séquence vidéo avant qu'elle se répète
clips_per_video: 8       # nombre de clips vidéo mélangés
sounds_per_video: 5      # nombre d'enregistrements mélangés
video_maxrate: 3M        # débit vidéo max (8 h ≈ 11 Go)

privacy: public          # public | unlisted | private
category_id: 22          # 22 = People & Blogs, 10 = Music
playlist_id: "PLbbqInyCAtYM" # playlist pluie (ambiances sans « playlist » propre)

# Playlists où chaque nouvelle vidéo est AUSSI ajoutée (ex. sons anti-anxiété)
extra_playlists: []

# Clips à ne plus jamais utiliser (ID Pixabay, visibles dans metadata.json)
blocked_clips: []

# Équilibrage automatique (06/11) : chaque publication prend la famille (pluie / feu / océan)
# qui a le MOINS de vidéos sur la chaîne (écrans noirs compris) ; pas de pluie tant que
# feu et océan n'ont pas rattrapé. Dans une famille, ses variantes ci-dessous tournent.
variants:
  - { theme: ocean,     thunder: false }
  - { theme: fireplace, thunder: false }
  - { theme: roof,      thunder: true }
  - { theme: ocean,     thunder: false }
  - { theme: fireplace, thunder: false }
  - { theme: window,    thunder: false }
  - { theme: ocean,     thunder: false }
  - { theme: fireplace, thunder: false }
  - { theme: forest,    thunder: true }
  - { theme: waterfall, thunder: false }

themes:
  window:
    video: ["raindrops window", "rain drops glass", "rain window"]
    sound: ["rain window", "rain on glass"]
  forest:
    video: ["rain forest", "rain leaves", "rainy jungle"]
    sound: ["rain forest", "rain leaves"]
  lake:
    video: ["rain on water", "rain lake", "rain pond drops"]
    sound: ["rain on water", "rain lake"]
  roof:
    video: ["rain roof", "rain cabin", "rain puddle"]
    sound: ["rain on roof", "rain tin roof"]
  fireplace:              # ambiance feu (hors rotation pluie, sans tonnerre)
    video: ["fireplace", "fireplace fire", "burning logs fireplace"]
    sound: ["fireplace crackling", "fire crackling", "crackling fire"]
    fallback_sound: "fireplace"
    playlist: "PLJQ4dxP4hw9M"  # playlist « Fireplace Sounds for Sleeping »
  ocean:                  # vagues de l'océan (hors pluie, sans tonnerre)
    video: ["ocean waves", "sea waves", "waves beach", "ocean waves rocks"]
    sound: ["ocean waves", "sea waves", "waves beach", "ocean surf"]
    fallback_sound: "ocean"
    playlist: "PLXQ6VvjRgovw"  # playlist « Ocean Waves Sounds for Sleeping »
  waterfall:              # chute d'eau (ajoutée le 06/11)
    video: ["waterfall", "waterfall forest", "waterfall nature", "cascade"]
    sound: ["waterfall", "waterfall close", "waterfall stream"]
    fallback_sound: "waterfall"
    playlist: ""          # playlist « chute d'eau » (créée par la tâche playlist_create)
  thunder_sound: ["distant thunder", "thunder rumble"]
